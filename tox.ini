[tox]
minversion = 4.4.3
envlist = py{310,311,312,313}{,-notebook}, lint, coverage, docs, doctest
isolated_build = True

[testenv]
package = wheel
wheel_build_env = .pkg
parallel_show_output = True
extras =
  test
commands =
  pytest {posargs}

[testenv:style]
extras =
  style
commands =
  ruff format qiskit_addon_utils/ docs/ test/
  ruff check --fix qiskit_addon_utils/ docs/ test/
  nbqa ruff --fix docs/

[testenv:lint]
image-tester-commit = 7ae965ccf21c39e5170334ec7f4882756883860a
deps =
  git+https://github.com/Qiskit/documentation.git@{[testenv:lint]image-tester-commit}\#egg=sphinx-alt-text-validator&subdirectory=scripts/image-tester
basepython = python3.10
extras =
  lint
commands =
  ruff format --check qiskit_addon_utils/ docs/ test/
  ruff check qiskit_addon_utils/ docs/ test/
  ruff check --preview --select CPY001 --exclude "*.ipynb" qiskit_addon_utils/ test/
  nbqa ruff docs/
  mypy qiskit_addon_utils/
  pylint -rn qiskit_addon_utils/ test/
  sphinx-alt-text-validator -f qiskit_addon_utils
  nbqa pylint -rn docs/
  reno lint

# NOTE: Keep the hyphen *outside* the braces, and do not nest braces.
#
# Writing this as `{,py310-,py311-,...}notebook` silently produces the wrong
# environments.  tox runs `expand_ranges()` over the section name before
# splitting on braces, and its range regex reads the trailing hyphen of each
# brace element as an open-ended numeric range: `py313-` parses as `py3` plus
# the range `13-`, which expands to `13,14,...` up to tox's newest known Python.
# The section then defines junk envs (`13notebook`, `pynotebook`, ...) and never
# defines `py313-notebook`, so `tox -e py313-notebook` silently falls back to
# the generic [testenv] and runs the unit tests instead of the notebooks.
#
# Nesting (`{notebook,{py310,py311}-notebook}`) is not supported either -- tox's
# brace regexes cannot span an inner `}` and it crashes with a ValueError.
[testenv:{notebook,py310-notebook,py311-notebook,py312-notebook,py313-notebook}]
extras =
  nbtest
  notebook-dependencies
commands =
  pytest --nbmake \
         --nbmake-timeout=3000 \
         --ignore=docs/how_tos/postselection_with_bit_flip_checks.ipynb \
         {posargs} docs/

# See the note above the notebook environments regarding this spelling.
[testenv:{doctest,py310-doctest,py311-doctest,py312-doctest,py313-doctest}]
extras =
  test
  doctest
commands =
  pytest --doctest-plus --doctest-only {posargs}

[testenv:coverage]
basepython = python3.11
deps =
  coverage>=7.4.1
extras =
  test
  doctest
commands =
  pytest --doctest-modules --cov=qiskit_addon_utils/

[testenv:docs]
basepython = python3.10
extras =
  docs
commands =
  sphinx-build -j auto -W -T --keep-going -b html {posargs} {toxinidir}/docs/ {toxinidir}/docs/_build/html
passenv =
  CI
  GITHUB_BASE_REF
  GITHUB_REF_NAME

[testenv:docs-clean]
skip_install = true
allowlist_externals =
  rm
commands =
  rm -rf {toxinidir}/docs/stubs/ {toxinidir}/docs/_build/
